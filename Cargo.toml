[package]
name = "tlog"
version = "1.4.3"
edition = "2024"
description = "Android Logcat TUI viewer with inline terminal scrollback"
license = "MIT"
repository = "https://github.com/ryans233/tlog"

[[bench]]
name = "replay"
harness = false

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
pest = "2"
pest_derive = "2"
chrono = "0.4"
regex = "1"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
futures = "0.3"
which = "7"
