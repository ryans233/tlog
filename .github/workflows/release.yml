name: Cross-Platform Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality gates
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/quality.yml

  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: quality
    if: |
      always() &&
      (!startsWith(github.ref, 'refs/tags/') || needs.quality.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            raw_asset: tlog
            legacy_asset: tlog-linux-amd64
            archive_asset: tlog-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            raw_asset: tlog.exe
            legacy_asset: tlog-windows-amd64.exe
            archive_asset: tlog-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            raw_asset: tlog
            legacy_asset: tlog-macos-amd64
            archive_asset: tlog-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            raw_asset: tlog
            legacy_asset: tlog-macos-arm64
            archive_asset: tlog-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          RAW_ASSET="target/${{ matrix.target }}/release/${{ matrix.raw_asset }}"
          test -f "$RAW_ASSET"
          cp "$RAW_ASSET" "${{ matrix.legacy_asset }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            python -c "import zipfile,pathlib,os; src=pathlib.Path(os.environ['RAW_ASSET']); dst=pathlib.Path(os.environ['ARCHIVE_ASSET']); archive=zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED); archive.write(src,arcname=src.name); archive.close()"
          else
            chmod +x "${{ matrix.legacy_asset }}"
            tar -czf "${{ matrix.archive_asset }}" -C "target/${{ matrix.target }}/release" "${{ matrix.raw_asset }}"
          fi
          python scripts/checksums.py "${{ matrix.legacy_asset }}" "${{ matrix.archive_asset }}" > SHA256SUMS
        env:
          RAW_ASSET: target/${{ matrix.target }}/release/${{ matrix.raw_asset }}
          ARCHIVE_ASSET: ${{ matrix.archive_asset }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.legacy_asset }}
          path: |
            ${{ matrix.legacy_asset }}
            ${{ matrix.archive_asset }}
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
